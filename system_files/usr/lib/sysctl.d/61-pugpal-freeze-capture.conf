# Freeze-diagnosis kit, carried over from the old install's
# /etc/sysctl.d/99-lockup-capture.conf. Freezes have not recurred lately but
# James is not confident they are gone (2026-10-09), so keep capturing.
# Turn a silent hang into a panic so kdump can capture a vmcore.
kernel.hardlockup_panic = 1
kernel.softlockup_panic = 1
kernel.panic_on_oops    = 1
# Seconds a CPU may be stuck before the detector fires (default 10).
kernel.watchdog_thresh  = 10
# Reboot 20s after panic. Gives kdump time to write, then recovers the box.
kernel.panic            = 20
# Dump a backtrace from EVERY cpu, not just the stuck one - essential for
# diagnosing a hang caused by a lock held on a different core.
kernel.hardlockup_all_cpu_backtrace = 1
kernel.softlockup_all_cpu_backtrace = 1
