# Carried over from the old install's /etc/sysctl.d (which lives on the root
# disk and would be wiped by the migration).

# minikube's docker-driver clusters exhaust the default inotify instance limit
# ("too many open files" in kube-system); James's e2e scripts
# (fieldpal-backend/e2e, kalyx k8s:verify) depend on this. Was 90-inotify.conf.
fs.inotify.max_user_instances = 8192

# Start reclaiming memory earlier under pressure. Was 99-memory-pressure.conf.
vm.watermark_scale_factor = 200
