# Groups that RPM scriptlets create at build time, declared so systemd-sysusers
# recreates them on deployed systems (/etc/group is three-way-merged on bootc
# upgrades and may never receive a group added to the image).
#
# The 1Password groups own setgid binaries, so the GIDs are FIXED and must
# match 40-apps.sh, which pre-creates them before the RPMs install. Left to
# themselves, 1Password's scriptlets run a plain `groupadd`, which takes the
# next user GID (1000+) - colliding with the first real user's own group.
# They must still be >= 1000: the 1Password app rejects a helper whose group
# is in the system range ("invalid group attempted to connect"), which broke
# browser integration while they were 921-923. pugpal-groups renumbers them
# in /etc/group on machines installed before the change.
g onepassword     1500
g onepassword-cli 1501
g onepassword-mcp 1502
g docker          -
