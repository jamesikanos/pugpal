# Stage image updates weekly (Sunday ~04:00), not daily: a staged image that
# isn't booted before the next run gets replaced, and its download (1-3 GB)
# was wasted. CI still builds daily; `sudo bootc upgrade` pulls one any time.
# Sorts after ublue's override.conf. An empty OnCalendar= resets every timer
# setting before it, incl. the unit's OnBootSec=1h / OnUnitInactiveSec=1d.
[Timer]
OnCalendar=
OnCalendar=Sun *-*-* 04:00:00
RandomizedDelaySec=10m
Persistent=true
