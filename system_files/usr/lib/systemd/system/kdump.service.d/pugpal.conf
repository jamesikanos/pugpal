# The crashkernel= reservation is per machine now (machine profile kernel
# args, applied by pugpal-setup). Without it kdump can only fail, so skip it.
[Unit]
ConditionKernelCommandLine=crashkernel

# On a plain-btrfs ostree root kdump-utils can't find /var/crash's device by
# itself; give it an explicit target first (see the script for the details).
[Service]
ExecStartPre=/usr/libexec/pugpal-kdump-target
