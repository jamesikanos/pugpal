# Two virtual cameras, replacing the package's single "OBS Virtual Camera"
# (98-v4l2loopback.conf; options given later win). Fixed numbers, so apps and
# the dotfiles can rely on the paths:
#   /dev/video42  "PugPal Cam"          fed by pugcam (pugpal-dotfiles)
#   /dev/video43  "OBS Virtual Camera"  for OBS's own virtual camera
# exclusive_caps: Chrome only lists a loopback device as a camera with it on.
# card_label: one quoted string, comma-separated - the kernel strips the outer
# quotes, then splits the array on commas.
options v4l2loopback devices=2 video_nr=42,43 card_label="PugPal Cam,OBS Virtual Camera" exclusive_caps=1,1
